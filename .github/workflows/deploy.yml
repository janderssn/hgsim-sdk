# Every push to main is tested and, if the tests pass, deployed to Fly.io (https://hgsim.fly.dev).
#
# The deploy job expects the existing repository secret FLY_API_TOKEN. Replace its value with an
# app-scoped deploy token for the Fly app hgsim (app = "hgsim" in fly.toml). Joel creates it with:
#
#   fly tokens create deploy -a hgsim
#
# The secret name stays FLY_API_TOKEN. Copy the whole token, including the "FlyV1 " prefix.
# A deploy token cannot create apps, so hgsim must already exist. After the secret is updated,
# revoke the previous organisation token for the personal org (Fly.io dashboard: personal → Tokens,
# or `fly tokens list --scope org` then `fly tokens revoke <id>`).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# checkout is the only GitHub API use, and it does not leave a token in the workspace.
# Deploy authenticates with FLY_API_TOKEN, so no job needs more.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.5"
      - run: npm test

  deploy:
    needs: test
    # Secrets are used only on a push to main. pull_request and workflow_dispatch run tests and do not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
